name: Preprocessing

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v3

      # Setup Python 3.12.7
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      # Run automate preprocessing script
      - name: Run preprocessing
        run: |
          python preprocessing/automate_DavidJonathanTjong.py

      # Commit & push hasil preprocessing terbaru kembali ke repo
      - name: Commit and push preprocessed dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/bank-full_preprocessing.csv
          git diff --staged --quiet || git commit -m "chore: update preprocessed dataset [automated]"
          git push
